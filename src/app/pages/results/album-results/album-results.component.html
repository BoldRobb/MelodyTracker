<div class="contenedor_principal" routerLinkActive="router-link-active" > 
    <div *ngFor="let album of albums" class="contenedor_artista" [routerLink]="['/album', album.id_album]">
        <img class="foto_user" [src]="album.photo" alt="fotoArtist">
        <div class="contenedor_datos_user">
            <p class="nombre_user">{{ album.name }}</p>
            <p class="rol" [routerLink]="['/artist', album.id_artist]">{{album.name_artist}}</p>
            <p class="stats">Album with {{ album.total_songs }} songs</p>
        </div>
    </div>
</div>
