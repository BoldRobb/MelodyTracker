<form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
    <div>
      <input class="campos" type="text" formControlName="username" placeholder="Username" required>
    </div>
    <div>
      <input class="campos" type="password" formControlName="password" placeholder="Password" required>
    </div>
    <div class="contenedor_boton">
      <button class="btn_login" type="submit" [disabled]="loginForm.invalid">Login</button>
    </div>
  </form>
