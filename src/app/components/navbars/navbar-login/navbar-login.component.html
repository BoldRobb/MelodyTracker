<header class="navbar">
    <a class="contenedor_logo" routerLink="/homepage">
      <p class="nombre">MelodyTracker</p>
      <img src="images/audifonos.png" alt="logo" class="logo">
    </a>
  
    <div class="contenedor_input">
      <i class="fa-solid fa-magnifying-glass logo_lupa" (click)="inputSearch.focus()"></i>
      <input type="text" class="input_search" #inputSearch spellcheck="false">
    </div>
  
    <div class="contenedor_enlaces">
      <a href="#" class="nombre">Songs</a>
      <a href="#" class="nombre">Play Lists</a>
      <a href="#" class="nombre">Albums</a>
      <a href="#" class="nombre" (click)="openModal($event)">Create List</a>
      <a href="#" class="contenedor_perfil">
        <img [src]="photo" alt="Profile Picture" class="img_profile">
      <p class="nombre">{{ username }}</p>  <!-- Mostrar el username dinámicamente -->
      </a>
    </div>
  </header>
  
  <!-- Mostrar el Modal solo cuando isOpen sea true -->
   @if (isOpen) {
    <app-create-list (close)="closeModal()"></app-create-list>
   }
